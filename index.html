<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock, Paper, Scissors!</title>
        <link rel="stylesheet" href="./style.css">
        <script src="./scripts.js" defer></script>
    </head>

    <body>
        <div id="page-container">
            <header>
                <h1 id="header-hero">Etch-A-Sketch</h1>
            </header>
            <main>
                <div id='board'>
                    <div id='sketch-space'>
                        <p id="board-text">
                            Move your mouse around the grid to color in the squares!
                        </p>
                        <div id='grid-container'>

                        </div>
                        <button id='clear-button'>Clear Board</button>
                    </div>
                </div>
            </main>
            <footer>
                <h1 id="footer-hero">Thanks for playing!</h1>
            </footer>
        </div>
    </body>
</html>
